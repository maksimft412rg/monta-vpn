name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'

      # 1. Удаляем старую папку android, чтобы Flutter создал чистую
      - name: Remove old android
        run: rm -rf android

      # 2. Создаем новую папку android
      - name: Create new android
        run: flutter create . --platforms=android

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: flutter pub get

      # 4. Просто собираем APK (без хитростей с Gradle)
      - name: Build APK
        run: flutter build apk --release

      # 5. Ищем готовый APK и копируем его в стандартное место
      - name: Copy APK
        run: |
          find . -name "*.apk"
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release.apk || true
          
      # 6. Загружаем артефакт
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
