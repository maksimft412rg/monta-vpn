name: monta_vpn
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_v2ray_client: ^3.3.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  http: ^1.2.0
  connectivity_plus: ^6.0.3
  qr_flutter: ^4.1.0   # ← Добавлено: используется для генерации QR-кодов

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0   # Можно оставить, но лучше обновить до ^4.0.0 или ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png   # ← Убедитесь, что этот файл существует, иначе Image.asset выдаст ошибку
